<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>きづきの診断</title>
<meta name="description" content="教育や「選ぶこと」に対する自分の価値観に気づくための診断です。子育て経験のある方・ない方が同じ質問に答えてくらべます。">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Kiwi+Maru:wght@500&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow notebook column on graph paper; each respondent has its own color so the comparison view reads at a glance */
:root{
  --paper:#F5F8FB; --sheet:#FFFFFF; --ink:#1D2938; --muted:#5A6778; --line:#D5DEE8; --grid:#E3EAF2;
  --parent:#2D6F9E; --parent-soft:#E2EEF7;
  --univ:#5552B0; --univ-soft:#E9E8F8;
  --kid:#C9781E; --kid-soft:#FBEEDC;
  --cmp:#3D4A5C; --cmp-soft:#E7ECF2;
  --good:#2F8A5B; --warn:#B7791F; --low:#B4483C;
  --accent:var(--parent); --accent-soft:var(--parent-soft); --on-accent:#FFFFFF;
  --f-display:"Kiwi Maru","Hiragino Maru Gothic ProN",serif;
  --f-body:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#121820; --sheet:#1A222D; --ink:#E5EBF2; --muted:#9BA8B8; --line:#2C3746; --grid:#18202A;
    --parent:#72B1DE; --parent-soft:#1D3243;
    --univ:#A29EF2; --univ-soft:#272645;
    --kid:#EBB066; --kid-soft:#3A2C19;
    --cmp:#C3CEDB; --cmp-soft:#232D3A;
    --good:#6BC797; --warn:#E3B45C; --low:#E8877B;
    --on-accent:#121820; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#121820; --sheet:#1A222D; --ink:#E5EBF2; --muted:#9BA8B8; --line:#2C3746; --grid:#18202A;
  --parent:#72B1DE; --parent-soft:#1D3243;
  --univ:#A29EF2; --univ-soft:#272645;
  --kid:#EBB066; --kid-soft:#3A2C19;
  --cmp:#C3CEDB; --cmp-soft:#232D3A;
  --good:#6BC797; --warn:#E3B45C; --low:#E8877B;
  --on-accent:#121820; color-scheme:dark;
}
[data-mode="parent"]{--accent:var(--parent); --accent-soft:var(--parent-soft);}
[data-mode="univ"]{--accent:var(--univ); --accent-soft:var(--univ-soft);}
[data-mode="kid"]{--accent:var(--kid); --accent-soft:var(--kid-soft);}
[data-mode="cmp"]{--accent:var(--cmp); --accent-soft:var(--cmp-soft);}

*{box-sizing:border-box;}
body{
  background-color:var(--paper); color:var(--ink); font-family:var(--f-body); font-size:15px; line-height:1.75;
  background-image:linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size:22px 22px;
}
.wrap{max-width:620px; margin:0 auto; padding-inline:16px; padding-block:28px 64px;}
header h1{font-family:var(--f-display); font-weight:500; font-size:2rem; line-height:1.3; margin:0 0 6px; text-wrap:balance;}
header p{margin:0 0 22px; color:var(--muted); max-width:48ch;}

.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:18px;}
.tabs button{font:inherit; font-weight:700; padding:11px 4px; border-radius:10px; cursor:pointer; border:1.5px solid var(--line); background:var(--sheet); color:var(--muted); line-height:1.3;}
.tabs button .ph{display:inline-block;}
.tabs button small{display:block; font-weight:400; font-size:.7rem;}
.tabs button .dot{display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:5px; vertical-align:middle;}
.tabs button[aria-selected="true"]{border-color:var(--accent); background:var(--accent-soft); color:var(--ink);}
.tabs button:focus-visible, .seg label:focus-within, .btn:focus-visible, textarea:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
@media (max-width:440px){ .tabs{grid-template-columns:repeat(2,1fr);} }

.sheet{background:var(--sheet); border:1px solid var(--line); border-radius:12px; padding:20px 18px;}
.frame{display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; margin:0 0 4px;}
.frame strong{font-family:var(--f-display); font-weight:500; font-size:1.15rem;}
.frame span{font-size:.82rem; color:var(--muted);}
.note{font-size:.85rem; color:var(--muted); margin:0 0 6px;}

.progress{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); padding-block:10px; margin-bottom:6px;}
.progress .track{height:6px; background:var(--line); border-radius:3px; overflow:hidden;}
.progress .fill{height:100%; width:0; background:var(--accent); transition:width .25s;}
.progress .count{font-size:.75rem; color:var(--muted); margin-top:4px; font-variant-numeric:tabular-nums;}

.section-h{font-family:var(--f-display); font-weight:500; font-size:1.05rem; margin:26px 0 2px; padding-top:18px; border-top:1px dashed var(--line);}
.section-h.first{border-top:none; padding-top:0; margin-top:14px;}
.tag{display:inline-block; font-family:var(--f-body); font-size:.7rem; font-weight:700; border-radius:999px; padding:1px 9px; margin-left:8px; vertical-align:middle; border:1.5px solid var(--accent); color:var(--accent);}

.q{padding:14px 0; border-bottom:1px solid var(--line);}
.q:last-child{border-bottom:none;}
.q p{margin:0 0 10px; font-size:.98rem;}
.q p b{font-weight:500; color:var(--muted); font-size:.78rem; margin-right:6px; font-variant-numeric:tabular-nums;}
.seg{display:grid; gap:6px;}
.seg.s4{grid-template-columns:repeat(4,1fr);}
.seg.s3{grid-template-columns:repeat(3,1fr);}
.seg label{position:relative; text-align:center; font-size:.8rem; line-height:1.3; padding:10px 2px; border-radius:8px; border:1.5px solid var(--line); cursor:pointer; color:var(--muted); background:var(--sheet); min-width:0;}
.seg input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
.seg label:has(input:checked){border-color:var(--accent); background:var(--accent); color:var(--on-accent); font-weight:700;}

.btn{font:inherit; font-weight:700; border-radius:10px; padding:13px 16px; cursor:pointer; width:100%; border:none; background:var(--accent); color:var(--on-accent); margin-top:18px;}
.btn:disabled{opacity:.4; cursor:not-allowed;}
.btn.ghost{background:transparent; color:var(--muted); border:1.5px solid var(--line); font-weight:500; margin-top:10px;}
.btn.inline{width:auto; margin-top:0; padding:8px 14px; font-size:.85rem;}
.hint{font-size:.8rem; color:var(--muted); text-align:center; margin:8px 0 0;}

.type{border-left:5px solid var(--accent); background:var(--accent-soft); border-radius:6px; padding:16px 16px 14px; margin-bottom:18px;}
.type .k{font-size:.78rem; color:var(--muted);}
.type h2{font-family:var(--f-display); font-weight:500; font-size:1.55rem; margin:2px 0 8px; text-wrap:balance;}
.type p{margin:0;}

.meta{display:flex; flex-wrap:wrap; gap:8px; margin-bottom:16px;}
.chip{font-size:.8rem; border-radius:999px; padding:4px 12px; border:1.5px solid var(--line); font-variant-numeric:tabular-nums;}
.chip.rel-high{border-color:var(--good); color:var(--good);}
.chip.rel-mid{border-color:var(--warn); color:var(--warn);}
.chip.rel-low{border-color:var(--low); color:var(--low);}

.bars{display:grid; gap:10px; margin-bottom:6px;}
.bar{display:grid; grid-template-columns:7.5em minmax(0,1fr) 2.6em; gap:10px; align-items:center; font-size:.85rem;}
.bar .nm{color:var(--muted);}
.bar .tr{height:10px; background:var(--line); border-radius:5px; overflow:hidden;}
.bar .fl{display:block; height:100%; background:var(--accent); border-radius:5px;}
.bar .vl{text-align:right; font-variant-numeric:tabular-nums;}
.axis-note{font-size:.78rem; color:var(--muted); margin:4px 0 0;}

.block{margin-top:22px; padding-top:16px; border-top:1px dashed var(--line);}
.block:first-child{margin-top:0; padding-top:0; border-top:none;}
.block h3{font-family:var(--f-display); font-weight:500; font-size:1.1rem; margin:0 0 8px;}
.block p{margin:0 0 8px;}
.warnbox{font-size:.85rem; border:1.5px solid var(--warn); border-radius:8px; padding:10px 12px; margin-bottom:16px;}

/* comparison */
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:.8rem; color:var(--muted); margin-bottom:12px;}
.legend span::before{content:""; display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:6px; vertical-align:-1px; background:var(--c);}
.grp{margin-bottom:14px;}
.grp .gname{font-size:.85rem; margin-bottom:4px;}
.grp .row{display:grid; grid-template-columns:7.2em minmax(0,1fr) 2.4em; gap:8px; align-items:center; font-size:.75rem; margin-bottom:3px;}
.grp .row .who{color:var(--muted);}
.grp .row .tr{height:8px; background:var(--line); border-radius:4px; overflow:hidden;}
.grp .row .fl{display:block; height:100%; border-radius:4px; background:var(--c);}
.grp .row .vl{text-align:right; font-variant-numeric:tabular-nums;}

.status{display:grid; gap:8px; margin:12px 0 4px;}
.status div{display:flex; justify-content:space-between; align-items:center; gap:10px; border:1px solid var(--line); border-radius:8px; padding:8px 12px; font-size:.9rem;}
.status .st{font-size:.78rem; color:var(--muted);}
.status .st.ok{color:var(--good); font-weight:700;}

.items{list-style:none; margin:10px 0 0; padding:0; display:grid; gap:8px;}
.items li{border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:.88rem;}
.items li.gap{border-color:var(--warn);}
.items .ans{display:flex; flex-wrap:wrap; gap:6px; margin-top:6px;}
.pill{font-size:.75rem; border-radius:999px; padding:2px 10px; border:1.5px solid var(--c); color:var(--ink); white-space:nowrap;}
.pill b{color:var(--c); margin-right:4px;}
.mk{font-size:.72rem; font-weight:700; border-radius:999px; padding:1px 9px; white-space:nowrap; margin-left:6px;}
.mk.ok{background:var(--good); color:var(--sheet);}
.mk.near{border:1.5px solid var(--warn); color:var(--warn);}
.mk.off{border:1.5px solid var(--low); color:var(--low);}

textarea{width:100%; min-height:90px; font:inherit; font-size:.95rem; border:1.5px solid var(--line); border-radius:8px; padding:10px; background:var(--sheet); color:var(--ink); resize:vertical;}
#copy-area{margin-top:10px; font-size:.8rem; min-height:160px;}
.sendst{font-size:.78rem; color:var(--muted); margin:0 0 14px;}
.sendst.ok{color:var(--good);}
.sendst.ng{color:var(--low);}
.btnrow{display:grid; gap:8px; grid-template-columns:1fr 1fr;}
@media (max-width:440px){ .btnrow{grid-template-columns:1fr;} }
.purpose{background:var(--sheet); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:0 0 14px; max-width:none;}
.purpose b{display:block; font-family:var(--f-display); font-weight:500; color:var(--ink); font-size:.95rem; margin-bottom:2px;}
.opts{display:grid; gap:6px;}
.opts label{position:relative; display:grid; grid-template-columns:1.9em minmax(0,1fr); gap:8px; align-items:start; font-size:.88rem; line-height:1.5; padding:9px 10px; border-radius:8px; border:1.5px solid var(--line); cursor:pointer; background:var(--sheet);}
.opts label .lt{display:inline-grid; place-items:center; width:1.7em; height:1.7em; border-radius:50%; border:1.5px solid var(--line); font-weight:700; font-size:.8rem; color:var(--muted);}
.opts input{position:absolute; opacity:0; inset:0; margin:0; cursor:pointer;}
.opts label:has(input:checked){border-color:var(--accent); background:var(--accent-soft);}
.opts label:has(input:checked) .lt{background:var(--accent); border-color:var(--accent); color:var(--on-accent);}
.opts label:focus-within{outline:2px solid var(--accent); outline-offset:2px;}
.scene{border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:.88rem; margin-bottom:8px;}
.scene .sq{color:var(--muted); font-size:.8rem;}
.scene .sa{margin-top:2px;}
.ttag{display:inline-block; font-size:.72rem; font-weight:700; border-radius:999px; padding:0 9px; margin-left:6px; border:1.5px solid var(--accent); color:var(--accent); white-space:nowrap;}
.survey .sv-h{font-family:var(--f-display); font-weight:500; font-size:.98rem; margin:18px 0 0;}
.survey .q{padding:12px 0;}
.survey label.tl{display:block; font-size:.92rem; margin:12px 0 6px;}
.survey textarea{min-height:72px;}
.req{font-size:.7rem; color:var(--low); margin-left:6px;}
.donebox{border:1.5px solid var(--good); border-radius:8px; padding:10px 12px; font-size:.9rem; color:var(--ink);}
.toast{font-size:.82rem; color:var(--good); text-align:center; margin-top:6px; min-height:1.2em;}

@media (prefers-reduced-motion: reduce){ .progress .fill{transition:none;} }
@media (max-width:420px){ .seg.s4 label{font-size:.72rem;} .bar{grid-template-columns:6.4em minmax(0,1fr) 2.4em;} }
</style>
<script src="config.js"></script>

</head>
<body>

<div class="wrap" id="app" data-mode="parent">
  <header>
    <h1>きづきの診断</h1>
    <p class="purpose"><b>このツールの目的</b>あなたが「教育」や「選ぶこと」に対して、どんな価値観を持っているかに気づいてもらうことです。</p>
    <p>はじめに身近な場面での行動をふりかえり、そのあと8つの質問に答えます。子育て経験のある方・ない方（高校生以下／大学生以上）が同じ質問に答えるので、答えをくらべると、立場や世代による考え方の違いや、大人が子どもの気持ちをどれだけ捉えているかが見えてきます。正解はありません。</p>
  </header>

  <div class="tabs" role="tablist" aria-label="だれが答えるか">
    <button role="tab" id="tab-parent" aria-selected="true" data-m="parent"><span class="dot" style="background:var(--parent)"></span><span class="ph">子育て経験</span><span class="ph">のある方</span><small>保護者など</small></button>
    <button role="tab" id="tab-kid" aria-selected="false" data-m="kid"><span class="dot" style="background:var(--kid)"></span><span class="ph">子育て経験</span><span class="ph">のない方</span><small>高校生以下</small></button>
    <button role="tab" id="tab-univ" aria-selected="false" data-m="univ"><span class="dot" style="background:var(--univ)"></span><span class="ph">子育て経験</span><span class="ph">のない方</span><small>大学生以上</small></button>
    <button role="tab" id="tab-cmp" aria-selected="false" data-m="cmp">くらべる<small>3つの立場の比較</small></button>
  </div>

  <div class="progress" id="progress"><div class="track"><div class="fill" id="pfill"></div></div><div class="count" id="pcount"></div></div>

  <section class="sheet" id="quiz"></section>
  <section class="sheet" id="result" hidden></section>
</div>

<script>
(function(){
const SC = 4;
const LB = {adult:['ちがう','ややちがう','ややそう','そう'], kid:['ちがう','ちょっとちがう','ちょっとそう','そう']};
const WHO = {parent:'子育て経験のある方', kid:'子育て経験のない方（高校生以下）', univ:'子育て経験のない方（大学生以上）'};
const SHORT = {parent:'子育て経験あり', kid:'高校生以下', univ:'大学生以上'};
const COLOR = {parent:'var(--parent)', kid:'var(--kid)', univ:'var(--univ)'};

/* 3者共通の8問：同じ内容・同じ向き・同じ4段階。並びは軸を交互にしている */
const CORE = [
  {id:'c1', axis:'self',   a:'自分が好きなこと・夢中になっていることを聞かれたら、すぐに答える', k:'すきなこと・むちゅうになっていることをきかれたら、すぐにこたえる'},
  {id:'c3', axis:'role',   a:'「こんな人になりたい」と思うお手本が身近にいる', k:'「こんな人になりたいな」と思う人がちかくにいる'},
  {id:'c5', axis:'flow',   a:'「周りがそうしているから」という理由で決めることが多い', k:'みんながやっているから、じぶんもやることが多い'},
  {id:'c7', axis:'chance', a:'やってみたいことを、実際に試している', k:'やってみたいことを、じっさいにやってみている'},
  {id:'c2', axis:'self',   a:'自分が何をしたいのか、よく分からないことが多い', k:'じぶんが何をしたいのか、わからないことが多い', rev:true},
  {id:'c4', axis:'role',   a:'身近な人の生き方は、どれも似たようなものばかりだ', k:'まわりの大人は、みんなにたような生き方をしている', rev:true},
  {id:'c6', axis:'flow',   a:'周りと違っても、自分がやりたいことを選ぶ', k:'みんなとちがっても、じぶんがやりたいことをえらぶ', rev:true},
  {id:'c8', axis:'chance', a:'やってみたいことがあっても、時間や周りの目を理由にあきらめることが多い', k:'やってみたいことがあっても、あきらめることが多い', rev:true}
];
const PAIRS = [['c1','c2'],['c3','c4'],['c5','c6'],['c7','c8']];

/* 診断のあとのアンケート：自分の現状にどれだけ気づけたか・理解できたか（4段階） */
const SV_ADULT = [
  {sec:'結果への納得感', items:[
    {id:'b1', t:'診断の結果は、自分に当てはまっていると思う'},
    {id:'b2', t:'結果の説明は分かりやすかった'}]},
  {sec:'自分への気づき', items:[
    {id:'c1', t:'診断を受ける前から、自分がどうやって選んできたかを考えたことがあった'},
    {id:'c2', t:'診断を受けて、自分の選びかたの傾向がはっきりした'},
    {id:'c3', t:'これまで気づいていなかった自分の一面に気づいた'},
    {id:'c4', t:'「周りに合わせて選んだ場面」や「お手本にした人」など、具体的な出来事を思い出した'}]},
  {sec:'子どもへの理解', items:[
    {id:'d1', t:'診断の前、身近な子どもの好きなことや気持ちを分かっているつもりだった'},
    {id:'d2', t:'予想と高校生以下の方の答えがずれた質問があり、意外に感じた（高校生以下の方が回答していない場合は、ずれそうだと感じた）'},
    {id:'d3', t:'子どもの気持ちを、もっと聞いてみたいと思った'},
    {id:'d4', t:'自分の考えや経験を、子どもに当てはめていた場面があったと気づいた'}]},
  {sec:'これからの行動', items:[
    {id:'e1', t:'この結果について、子どもや身近な人と話してみたい'},
    {id:'e2', t:'1週間以内に、子どもに好きなことや最近の気持ちを聞いてみようと思う'},
    {id:'e3', t:'年下の子と関わる機会があれば、参加してみたい', only:'univ'}]}
];
const SV_KID = [
  {sec:'やってみて', items:[
    {id:'k1', t:'けっかは、じぶんに当てはまっていると思う'},
    {id:'k2', t:'じぶんのことで、あたらしくわかったことがあった'},
    {id:'k3', t:'このけっかについて、おうちの人や大人と話してみたい'},
    {id:'k4', t:'おうちの人に、じぶんの「すき」をもっと知ってほしいと思った'}]}
];
const SV_TEXT = {
  f1:'診断を受けて、一番意外だった結果や、気づいたことを書いてください',
  f2:'その気づきをきっかけに、やってみたいことがあれば書いてください',
  f3:'分かりにくかった質問や、改善してほしい点があれば書いてください',
  k5:'やってみて、きづいたことをかいてね'
};
const svItems = m => (m==='kid' ? SV_KID : SV_ADULT).flatMap(g=>g.items).filter(it=>!it.only || it.only===m);
const SV_ALL = SV_ADULT.flatMap(g=>g.items).concat(SV_KID.flatMap(g=>g.items));
const to100 = v => Math.round((v-1)/3*1000)/10;
const mean = a => a.reduce((x,y)=>x+y,0)/a.length;
/* 指標（0〜100。伸びは−3〜+3、思い込みへの気づきは1/0） */
function svIndex(m){
  const v = state.sv[m], g = id => v[id];
  if(!state.svDone[m]) return {fit:'', self:'', kidu:'', grow:'', bias:'', act:''};
  if(m==='kid') return {fit:to100(g('k1')), self:to100(g('k2')), kidu:'', grow:'', bias:'', act:to100(mean([g('k3'),g('k4')]))};
  return {fit:to100(mean([g('b1'),g('b2')])), self:to100(mean([g('c2'),g('c3'),g('c4')])), kidu:to100(mean([g('d2'),g('d3'),g('d4')])),

const allItems = m => SETS[m].sections.flatMap(s=>s.items);
const score01 = (it, raw) => { const v = it.rev ? (SC+1-raw) : raw; return (v-1)/(SC-1)*100; };
function axisScore(m, axis){
  const its = allItems(m).filter(it=>it.axis===axis);
  return Math.round(its.reduce((s,it)=>s+score01(it, state.ans[m][it.id]),0)/its.length);
}
function scores(m){ const o={}; AXES.forEach(a=>o[a]=axisScore(m,a)); o.flex = Math.round((o.self+o.role+o.chance+(100-o.flow))/4); return o; }

function reliability(m){
  const a = state.ans[m];
  let contra = 0;
  PAIRS.forEach(([p,r])=>{ if((a[p]===4 && a[r]===4) || (a[p]===1 && a[r]===1)) contra++; });
  const raws = CORE.map(c=>a[c.id]); const straight = raws.every(v=>v===raws[0]);
  const kid = m==='kid';
  if(straight) return {level:'low', text: kid?'ぜんぶ同じこたえでした':'すべて同じ回答でした', straight};
  if(contra===0) return {level:'high', text: kid?'こたえのまとまり：よい':'回答の一貫性：高い'};
  if(contra===1) return {level:'mid', text: kid?'こたえのまとまり：ふつう':'回答の一貫性：ふつう'};
  return {level:'low', text: kid?'こたえのまとまり：ひくめ':'回答の一貫性：低め'};
}
function decideType(sc){
  const pos = [['self',sc.self],['role',sc.role],['chance',sc.chance]].sort((a,b)=>b[1]-a[1]);
  if(sc.flow>=60 && pos[0][1]<60) return {main:'flow'};
  if(pos[0][1]<40) return {main:'open'};
  if(pos[0][1]-pos[1][1] <= 8) return {main:pos[0][0], second:pos[1][0]};
  return {main:pos[0][0]};
}

  let h = `<h3>${kid?'さいごに：アンケート':'アンケート：診断をやってみて'}</h3>`;
  if(state.svDone[m]){
    return h + `<div class="donebox">${kid?'✓ こたえてくれてありがとう！':'✓ アンケートに回答しました。ご協力ありがとうございました。'}</div>`;
  }
  h += `<p class="note">${kid?'やってみて、どうだったかおしえてね。':'診断を通して、自分の今の状態にどれくらい気づけたかを教えてください（約2分）。「くらべる」タブを見てから答えても大丈夫です。'}</p>`;
  const labels = LB[kid?'kid':'adult'];
  let n = 0;
  (kid ? SV_KID : SV_ADULT).forEach(g=>{
    const its = g.items.filter(it=>!it.only || it.only===m);
    if(!kid) h += `<div class="sv-h">${g.sec}</div>`;
    its.forEach(it=>{
      n++;
      h += `<div class="q"><p><b>${n}</b>${it.t}</p><div class="seg s4" role="radiogroup" aria-label="${it.t}">` +
        labels.map((lb,i)=>{ const v=i+1, id=`sv-${m}-${it.id}-${v}`; return `<label for="${id}"><input type="radio" id="${id}" name="sv|${m}|${it.id}" value="${v}" ${state.sv[m][it.id]===v?'checked':''}>${lb}</label>`; }).join('') +
        `</div></div>`;
    });
  });
  if(kid){
    h += `<label class="tl" for="sv-note-${m}">${SV_TEXT.k5}</label><textarea id="sv-note-${m}" placeholder="なんでもいいよ">${esc(state.note[m])}</textarea>`;
  } else {
    h += `<div class="sv-h">自由記述</div>`;
    h += `<label class="tl" for="sv-note-${m}">${SV_TEXT.f1}<span class="req">必須</span></label><textarea id="sv-note-${m}" placeholder="意外だった結果や、思い出した出来事、人など">${esc(state.note[m])}</textarea>`;
    h += `<label class="tl" for="sv-f2-${m}">${SV_TEXT.f2}</label><textarea id="sv-f2-${m}">${esc(state.sv3[m].f2||'')}</textarea>`;
    h += `<label class="tl" for="sv-f3-${m}">${SV_TEXT.f3}</label><textarea id="sv-f3-${m}">${esc(state.sv3[m].f3||'')}</textarea>`;
  }
  h += `<button class="btn" id="sv-send" type="button">${kid?'アンケートをおくる':'アンケートを送信する'}</button><p class="hint" id="sv-remain"></p>`;
  return h;
}
function bindSurvey(m){
  if(state.svDone[m]) return;
  const box = document.getElementById('survey'), kid = m==='kid';
  const upd = ()=>{
    const left = svItems(m).filter(it=>!state.sv[m][it.id]).length + (!kid && !state.note[m].trim() ? 1 : 0);
    document.getElementById('sv-send').disabled = left>0;
    document.getElementById('sv-remain').textContent = left ? (kid?`あと${left}こ`:`あと${left}問`) : '';
  };
  box.querySelectorAll('input[type=radio]').forEach(inp=>inp.addEventListener('change', e=>{ const [, mm, id] = e.target.name.split('|'); state.sv[mm][id] = Number(e.target.value); upd(); }));
  document.getElementById('sv-note-'+m).addEventListener('input', e=>{ state.note[m]=e.target.value; upd(); });
  ['f2','f3'].forEach(f=>{ const el = document.getElementById(`sv-${f}-${m}`); if(el) el.addEventListener('input', e=>{ state.sv3[m][f]=e.target.value; }); });
  document.getElementById('sv-send').addEventListener('click', ()=>{
    state.svDone[m] = true; sendRow(m);
    box.innerHTML = surveyHtml(m);
    if(!SHEET_URL) box.insertAdjacentHTML('beforeend', `<p class="note" style="margin-top:8px">${kid?'こたえは「くらべる」タブのExcel保存に入ります。':'回答は「くらべる」タブの「Excelで保存する」に含まれます。'}</p>`);
  });
  upd();
}

function ansLabel(raw){ return LB.adult[raw-1]; }

function renderCompare(){
  const done = Object.keys(WHO).filter(k=>state.done[k]);
  let h = `<div class="block"><h3>回答の状況</h3><p class="note">同じ端末で、それぞれのタブから答えてください。2人以上答えると比較が表示されます。</p><div class="status">` +
    Object.keys(WHO).map(k=>`<div><span><span class="dot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${COLOR[k]};margin-right:8px"></span>${WHO[k]}</span><span class="st ${state.done[k]?'ok':''}">${state.done[k]?'回答済み':'未回答'}</span></div>`).join('') + `</div></div>`;

  if(done.length>=2){
    const S = {}; done.forEach(k=>S[k]=scores(k));
    const legend = `<div class="legend">${done.map(k=>`<span style="--c:${COLOR[k]}">${SHORT[k]}</span>`).join('')}</div>`;
    h += `<div class="block"><h3>4つの視点でくらべる</h3>${legend}` +
      AXES.concat(['flex']).map(a=>`<div class="grp"><div class="gname">${a==='flex'?'柔軟度（総合）':AXIS_LABEL[a]}</div>${done.map(k=>`<div class="row" style="--c:${COLOR[k]}"><span class="who">${SHORT[k]}</span><span class="tr"><span class="fl" style="width:${S[k][a]}%"></span></span><span class="vl">${S[k][a]}</span></div>`).join('')}</div>`).join('') +
      `<p class="axis-note">「流されやすさ」は高いほど周囲に合わせて選ぶ傾向です。</p></div>`;

    // 質問ごとの比較（差の大きいものを上に）
    const rows = CORE.map(c=>{
      const vals = done.map(k=>state.ans[k][c.id]);
      const gap = Math.max(...vals)-Math.min(...vals);
      return {c, gap};
    }).sort((x,y)=>y.gap-x.gap);
    const bigs = rows.filter(r=>r.gap>=2).length;
    h += `<div class="block"><h3>質問ごとの答え</h3><p class="note">${bigs?`答えが2段階以上離れている質問が${bigs}つあります。枠が色付きの質問から話してみてください。`:'大きく離れた質問はありませんでした。'}</p><ul class="items">` +
      rows.map(r=>`<li class="${r.gap>=2?'gap':''}">${r.c.a}<div class="ans">${done.map(k=>`<span class="pill" style="--c:${COLOR[k]}"><b>${SHORT[k]}</b>${ansLabel(state.ans[k][r.c.id])}</span>`).join('')}</div></li>`).join('') + `</ul></div>`;
  }

  if(done.length>=2){
    h += `<div class="block"><h3>ふりかえりの選択をくらべる</h3><p class="note">場面の聞き方は立場ごとに少し違いますが、選択肢の考え方（A〜D）はそろえています。</p><ul class="items">` +
      SCENE_TITLE.map((tt,i)=>`<li>${tt}<div class="ans">${done.map(k=>`<span class="pill" style="--c:${COLOR[k]}"><b>${SHORT[k]}</b>${sceneLabel(k, SCENES[k][i].id)}</span>`).join('')}</div></li>`).join('') + `</ul></div>`;
  }

  // 予想と本人
  const predictors = ['parent','univ'].filter(k=>state.done[k]);
  if(state.done.kid && predictors.length){
    h += `<div class="block"><h3>予想と、高校生以下の方の答え</h3><p class="note">子育て経験のある方・大学生以上の方が「子どもならこう答える」と予想した答えと、高校生以下の方の実際の答えをくらべています。</p><div class="meta">` +
      predictors.map(k=>{ const ex = CORE.filter(c=>state.ans[k]['p_'+c.id]===state.ans.kid[c.id]).length;
        const near = CORE.filter(c=>Math.abs(state.ans[k]['p_'+c.id]-state.ans.kid[c.id])<=1).length;
        return `<span class="chip" style="border-color:${COLOR[k]}">${SHORT[k]}の予想　一致 ${ex}/8・ほぼ一致 ${near}/8</span>`; }).join('') + `</div><ul class="items">` +
      CORE.map(c=>`<li>${c.k}<div class="ans"><span class="pill" style="--c:var(--kid)"><b>高校生以下（本人）</b>${LB.kid[state.ans.kid[c.id]-1]}</span>${predictors.map(k=>{ const p=state.ans[k]['p_'+c.id], d=Math.abs(p-state.ans.kid[c.id]); return `<span class="pill" style="--c:${COLOR[k]}"><b>${SHORT[k]}の予想</b>${LB.kid[p-1]}<span class="mk ${d===0?'ok':d===1?'near':'off'}">${d===0?'一致':d===1?'近い':'ずれ'}</span></span>`; }).join('')}</div></li>`).join('') + `</ul></div>`;
  } else if(predictors.length || state.done.kid){
    h += `<div class="block"><h3>予想と、高校生以下の方の答え</h3><p class="note">高校生以下の方と、子育て経験のある方または大学生以上の方の両方が答えると、予想と実際の答えのずれが表示されます。</p></div>`;
  }

  if(done.length){
    h += `<div class="block"><h3>結果を記録する</h3><p class="note">${SHEET_URL?'回答は自動で集計シートに送られています。手元にも残したいときは、Excelファイルで保存できます。':'この端末で答えた全員分の結果を、Excelファイルで保存できます。複数のファイルは<a href="aggregate.html">集計ページ</a>で1つにまとめられます。'}</p>
      <div class="btnrow"><button class="btn" type="button" id="xlsx">Excelで保存する</button><button class="btn" type="button" id="copy">テキストでコピー</button></div>
      <p class="toast" id="toast" aria-live="polite"></p><textarea id="copy-area" readonly hidden></textarea></div>`;
    h += `<div class="block"><h3>次の人へ</h3><p class="note">この端末で別の家族・グループが答えるときは、今の回答を消してから始めてください。${SHEET_URL?'送信済みの回答は集計シートに残ります。':'消す前にExcelで保存しておくのを忘れずに。'}</p><button class="btn ghost" type="button" id="reset">回答を消して最初から</button></div>`;
  }
  result.innerHTML = h;
  const cp = document.getElementById('copy'); if(cp) cp.addEventListener('click', copyAll);
  const xb = document.getElementById('xlsx'); if(xb) xb.addEventListener('click', saveXlsx);
  const rs = document.getElementById('reset'); if(rs) rs.addEventListener('click', ()=>{
    if(rs.dataset.armed!=='1'){ rs.dataset.armed='1'; rs.textContent='本当に消す（もう一度押してください）'; return; }
    ['parent','kid','univ'].forEach(k=>{ state.ans[k]={}; state.done[k]=false; state.note[k]=''; state.sv[k]={}; state.sv3[k]={}; state.svDone[k]=false; state.rid[k]=null; state.at[k]=null; state.sent[k]=''; });
    state.sid = newId(8); switchMode('parent'); window.scrollTo(0,0);
  });
}

function copyAll(){
  const lines = ['【きづきの診断】'];
  Object.keys(WHO).filter(k=>state.done[k]).forEach(k=>{
    const sc = scores(k), t = decideType(sc), nm = k==='kid'?TYPES[t.main].k:TYPES[t.main].a;
    lines.push(`■${WHO[k]}${k==='kid' && state.ans.kid.grade ? '（'+state.ans.kid.grade+'）' : ''}　タイプ：${nm}　柔軟度：${sc.flex}　${reliability(k).text}`);
    lines.push('  ' + AXES.map(a=>`${AXIS_LABEL[a]} ${sc[a]}`).join(' / '));
    lines.push('  回答：' + CORE.map(c=>`${c.id}=${state.ans[k][c.id]}`).join(' '));
    lines.push('  ふりかえり：' + SCENES[k].map((s,i)=>`場面${i+1}=${sceneLabel(k, s.id)}`).join(' '));
    if(k!=='kid') lines.push('  子どもの予想：' + CORE.map(c=>`${c.id}=${state.ans[k]['p_'+c.id]}`).join(' '));
    if(k==='univ') lines.push(`  サポーター適性：${axisScore('univ','sup')}`);
    if(state.svDone[k]){ const x = svIndex(k); lines.push(`  アンケート：納得感 ${x.fit} / 自分への気づき ${x.self}${k==='kid'?'':` / 子どもへの理解 ${x.kidu} / 気づきの伸び ${x.grow}`} / 行動意思 ${x.act}`); }
    if(state.note[k]) lines.push(`  気づいたこと：${state.note[k]}`);
  });
  const t = lines.join('\n');
  const area = document.getElementById('copy-area'), toast = document.getElementById('toast');
  const fb = ()=>{ area.value=t; area.hidden=false; area.focus(); area.select(); toast.textContent='コピーできなかったので、下の文章を選択してコピーしてください。'; };
  try{ navigator.clipboard.writeText(t).then(()=>{ toast.textContent='コピーしました'; }, fb); }catch(e){ fb(); }
}

/* ---- 集計用の行データ（Googleスプレッドシート・Excel共通の列） ---- */
function newId(n){ const a='abcdefghjkmnpqrstuvwxyz23456789'; let s=''; const r=new Uint32Array(n); crypto.getRandomValues(r); r.forEach(v=>s+=a[v%a.length]); return s; }
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; }
const QN = CORE.map((c,i)=>`Q${i+1} ${c.a}`);
const SV_IDX = [['fit','指標：結果への納得感'],['self','指標：自分への気づき'],['kidu','指標：子どもへの理解'],['grow','指標：気づきの伸び(C2-C1)'],['bias','指標：思い込みへの気づき(1=あり)'],['act','指標：行動意思']];
const HEADERS = ['回答日時','グループ','セッションID','回答ID','回答者','学年（高校生以下）','タイプ','サブタイプ','柔軟度',
  ...AXES.map(a=>AXIS_LABEL[a]), '回答の一貫性',
  ...SCENE_TITLE.map((t,i)=>`場面${i+1}（${t}）`),
  ...QN, ...CORE.map((c,i)=>`子どもの予想Q${i+1}`), '予想の一致数(子ども本人と)',
  ...SUP.map((s,i)=>`S${i+1} ${s.a}`), 'サポーター適性',
  'アンケート回答', ...SV_ALL.map(it=>`${it.id.toUpperCase()} ${it.t}`), ...SV_IDX.map(x=>x[1]),
  '気づいたこと', `F2 ${SV_TEXT.f2}`, `F3 ${SV_TEXT.f3}`];
function buildRow(k){
  const sc = scores(k), t = decideType(sc), a = state.ans[k], nm = x => x ? TYPES[x].a : ''; // 集計しやすいよう子どもも大人向けのタイプ名で記録
  const pred = k!=='kid', kidDone = state.done.kid;
  const match = pred && kidDone ? CORE.filter(c=>a['p_'+c.id]===state.ans.kid[c.id]).length : '';
  return [fmtDate(state.at[k]||new Date()), GROUP, state.sid, state.rid[k], WHO[k], k==='kid' ? (a.grade||'') : '', nm(t.main), nm(t.second), sc.flex,
    ...AXES.map(x=>sc[x]), relLabel(k),
    ...SCENES[k].map(s=>sceneLabel(k, s.id)),
    ...CORE.map(c=>a[c.id]), ...CORE.map(c=>pred ? a['p_'+c.id] : ''), match,
    ...SUP.map(s=>k==='univ' ? a[s.id] : ''), k==='univ' ? axisScore('univ','sup') : '',
    state.svDone[k] ? '済' : '', ...SV_ALL.map(it=>state.svDone[k] && state.sv[k][it.id] ? state.sv[k][it.id] : ''),
    ...SV_IDX.map(x=>svIndex(k)[x[0]]),
    state.note[k], state.svDone[k] ? (state.sv3[k].f2||'') : '', state.svDone[k] ? (state.sv3[k].f3||'') : ''];
}
function relLabel(k){ const r = reliability(k); return r.straight ? '全問同じ回答' : {high:'高い', mid:'ふつう', low:'低め'}[r.level]; }
function sendText(m){
  const kid = m==='kid', st = state.sent[m];
  if(st==='ok') return kid?'✓ 集計におくりました':'✓ 集計シートに送信しました';
  if(st==='ng') return kid?'集計におくれませんでした':'集計シートに送信できませんでした。「くらべる」タブからExcelで保存してください。';
  return kid?'集計におくっています…':'集計シートに送信しています…';
}
function sendRow(k){
  if(!SHEET_URL || !state.rid[k]) return;
  const body = JSON.stringify({id:state.rid[k], headers:HEADERS, row:buildRow(k)});
  state.sent[k]='';
  const done = ok => { state.sent[k]=ok?'ok':'ng'; const el=document.getElementById('sendst'); if(el && state.mode===k){ el.className='sendst '+state.sent[k]; el.textContent=sendText(k); } };
  // Apps Script はCORS応答を返さないため no-cors で送る（text/plain なのでプリフライトなし）
  fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body})
    .then(()=>done(true), ()=>done(false));
}
async function saveBook(wb, filename){
  const blob = new Blob([XLSX.write(wb, {bookType:'xlsx', type:'array'})], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  // claude.ai のアーティファクト内では downloads 機能で保存（通常のWebページでは undefined）
  const dl = window.claude && window.claude.use ? await window.claude.use('downloads').catch(()=>null) : null;
  if(dl){ await dl.save({filename, data:blob}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
}
function saveErr(e){ return e && e.code==='declined' ? '保存をキャンセルしました。' : '保存できませんでした。ブラウザを変えてお試しください。'; }
function saveXlsx(){
  const toast = document.getElementById('toast');
  if(!window.XLSX){ toast.textContent='Excel保存の準備ができていません。通信環境を確認して、もう一度押してください。'; return; }
  const ks = Object.keys(WHO).filter(k=>state.done[k]);
  ks.forEach(k=>{ if(!state.rid[k]) state.rid[k]=newId(12); });
  const ws = XLSX.utils.aoa_to_sheet([HEADERS, ...ks.map(buildRow)]);
  ws['!cols'] = HEADERS.map((h,i)=>({wch: i<8 ? 14 : h.length>14 ? 18 : 12}));
  const legend = [['項目','説明'],
    ['Q1〜Q8','3者共通の質問。1=ちがう / 2=ややちがう / 3=ややそう / 4=そう（素点）'],
    ['学年（高校生以下）','高校生以下の方が最初に選んだ学年（小学生・中学生・高校生）'],
    ['場面1〜3','ふりかえりで選んだ行動。A=自分で考えて決める / B=身近な人を参考にする / C=まず試してみる / D=周りに合わせる（場面の聞き方は立場ごとに少し違う）'],
    ['子どもの予想Q1〜Q8','子育て経験のある方・大学生以上の方が「子どもならこう答える」と予想した答え（1〜4）'],
    ['予想の一致数','同じ端末で答えた高校生以下の方の答えと、予想がぴったり一致した数（8問中）'],
    ['S1〜S4','大学生以上のみ。サポーター適性の質問（1〜4、S4は逆向きに採点）'],
    ['各スコア','0〜100。「流されやすさ」は高いほど周囲に合わせる傾向。柔軟度では逆向きに数える'],
    ['アンケート回答','診断のあとのアンケートに答えた人は「済」'],
    ['B1〜E3・K1〜K4','アンケートの答え（1=ちがう 〜 4=そう）。B〜Eは大人、Kは高校生以下、E3は大学生以上のみ'],
    ['指標：〜','アンケートから計算。納得感=B1・B2（高校生以下はK1）、自分への気づき=C2〜C4（K2）、子どもへの理解=D2〜D4、行動意思=E1・E2（K3・K4）の平均を0〜100に換算。気づきの伸び=C2−C1（−3〜+3）。思い込みへの気づき=D1とD2がどちらも3以上なら1'],
    ['気づいたこと・F2・F3','アンケートの自由記述（高校生以下は「気づいたこと」のみ）'],
    ['セッションID','同じ端末・同じ回で答えた人に共通のID。家族やグループの回答をつなげるのに使う'],
    ['グループ','URLの ?g=名前 で指定したグループ名（イベント名など）']];
  const wl = XLSX.utils.aoa_to_sheet(legend); wl['!cols']=[{wch:20},{wch:70}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, '回答');
  XLSX.utils.book_append_sheet(wb, wl, '凡例');
  const d = new Date();
  saveBook(wb, `kizuki_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}_${state.sid}.xlsx`).then(()=>{ toast.textContent='Excelファイルを保存しました'; }, e=>{ toast.textContent=saveErr(e); });
}

function esc(s){ return String(s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

function switchMode(m){
  state.mode = m; app.dataset.mode = m;
  document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected', String(b.dataset.m===m)));
  if(m==='cmp'){ quiz.hidden=true; prog.hidden=true; result.hidden=false; renderCompare(); return; }
  if(state.done[m]){ quiz.hidden=true; prog.hidden=true; result.hidden=false; renderResult(); }
  else { result.hidden=true; quiz.hidden=false; prog.hidden=false; renderQuiz(); }
}
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click', ()=>switchMode(b.dataset.m)));
switchMode('parent');
})();
</script>
